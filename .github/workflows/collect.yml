name: Collect jobs
on:
  schedule:
    # GitHub cron uses UTC. India (IST) = UTC + 5:30.
    # 11:35, 13:35, 15:35, 17:35, 19:35 UTC -> 5:05, 7:05, 9:05, 11:05 PM and 1:05 AM IST (every 2 hours).
    - cron: '35 11,13,15,17,19 * * *'
  workflow_dispatch: {}       # "Run workflow" button for manual runs at any time
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_BUDGET_MINUTES: '100'   # stop starting new boards after this; the rest go first next run
