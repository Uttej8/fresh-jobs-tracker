name: Collect jobs
on:
  schedule:
    # GitHub cron uses UTC. India (IST) = UTC + 5:30.
    # Hours 12-20 UTC at minute 5 -> 5:35 PM to 1:35 AM IST
    - cron: '5 12-20 * * *'
  workflow_dispatch: {}
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
